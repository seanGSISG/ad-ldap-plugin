[project]
name = "ad-ldap-mcp"
version = "0.1.0"
description = "FastMCP server wrapping ldap3 for Active Directory administration (HTTP + stdio transports)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3,<4",
    "ldap3>=2.9.1",
    # HTTP transport (permanent-container deployment): a bearer-protected
    # streamable-HTTP server. Pulled transitively by fastmcp, but declared
    # explicitly so the production image always has them.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

# The MCP server lives as flat modules under mcp/ (no __init__.py on purpose:
# a regular `mcp` package in site-packages must win the import over this dir).
# Nothing here is an installable package, so disable build/packaging.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
